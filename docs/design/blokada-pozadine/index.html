<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pozadine ekrana blokade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0F1926; --card:#182534; --raised:#1F2E40; --text:#E7EEF6; --dim:#7A8FA9; --focus:#3FBFA3; --distraction:#FF6B35; }
  * { box-sizing:border-box; margin:0; }
  body { background:#05090F; color:var(--text); font-family:Archivo, system-ui, sans-serif; padding:24px 16px 40px; }
  h1 { font-size:20px; font-weight:700; margin-bottom:4px; }
  .lead { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .row { display:flex; flex-wrap:wrap; gap:20px; }
  figure { width:250px; }
  figcaption { margin-top:10px; font-size:13px; line-height:1.4; }
  figcaption b { display:block; font-size:14px; }
  figcaption span { color:var(--dim); }

  .phone { container-type:inline-size; position:relative; width:100%; aspect-ratio:891/2000; border-radius:22px; overflow:hidden; background:var(--ground); outline:1px solid #24354A; }
  .bg, .scrim { position:absolute; inset:0; width:100%; height:100%; }
  .bg { object-fit:cover; }
  .ui { position:absolute; left:7.9cqw; right:7.9cqw; top:76cqw; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .icon { width:20.4cqw; height:20.4cqw; border-radius:50%; background:rgba(255,107,53,.15); display:grid; place-items:center; }
  .icon svg { width:7cqw; height:7cqw; }
  .title { margin-top:7.6cqw; font-size:5.9cqw; font-weight:700; letter-spacing:-.02em; }
  .body { margin-top:3.4cqw; font-size:3.55cqw; color:#9DB0C6; white-space:nowrap; }
  .card { margin-top:5.6cqw; width:100%; height:14.6cqw; border-radius:3.4cqw; background:rgba(24,37,52,.82); backdrop-filter:blur(14px); display:flex; align-items:center; gap:3.6cqw; padding:0 4cqw; text-align:left; }
  .card .n { font-size:6.2cqw; font-weight:700; color:var(--focus); }
  .card .t { font-size:2.95cqw; color:var(--dim); }
  .btn { margin-top:7.3cqw; width:100%; height:12.2cqw; border-radius:3.4cqw; background:rgba(31,46,64,.9); backdrop-filter:blur(14px); display:grid; place-items:center; font-size:3.6cqw; font-weight:700; }

  .scrim-photo { background:linear-gradient(to bottom, rgba(8,15,24,.30) 0%, rgba(15,25,38,.60) 32%, rgba(15,25,38,.66) 62%, rgba(8,15,24,.10) 82%, rgba(8,15,24,.35) 100%); }
  .scrim-ai { background:linear-gradient(to bottom, rgba(8,15,24,.25) 0%, rgba(15,25,38,.55) 30%, rgba(15,25,38,.60) 66%, rgba(8,15,24,.15) 100%); }
  .pending { position:absolute; inset:0; display:grid; place-items:center; padding:0 12cqw; text-align:center; font-size:4.2cqw; color:var(--dim); border:2px dashed #24354A; border-radius:22px; }
  .bg.shift { transform:scale(1.38); transform-origin:50% 0; }
  .hero .bg { height:64%; -webkit-mask-image:linear-gradient(to bottom, #000 62%, transparent 100%); mask-image:linear-gradient(to bottom, #000 62%, transparent 100%); }
  .hero .ui { top:124cqw; }
  .scrim-illu { background:linear-gradient(to bottom, rgba(8,15,24,.35) 0%, rgba(15,25,38,.72) 30%, rgba(15,25,38,.78) 66%, rgba(8,15,24,.30) 100%); }
  h2 { font-size:15px; font-weight:600; color:var(--dim); margin:8px 0 12px; }
  .row + h2 { margin-top:32px; }
  .current { background:linear-gradient(to bottom, #172231 0%, #111A26 55%, #15161A 100%); }
</style>
</head>
<body>
<h1>Ekran blokade: pozadine</h1>
<p class="lead">Isti UI svuda, menja se samo pozadina. Sve slike su besplatne i dozvoljena je komercijalna upotreba.</p>

<template id="ui">
  <div class="ui">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 18.4 18.4 5.6"/></svg></div>
    <div class="title">TikTok blocked</div>
    <div class="body">You blocked this to protect your focus. Take a break.</div>
    <div class="card"><span class="n">3</span><span class="t">times today Block Doomscroll stopped you</span></div>
    <div class="btn">Exit</div>
  </div>
</template>

<h2>Izabrani set: 3 prave fotografije</h2>
<div class="row">
  <figure>
    <div class="phone"><img class="bg" src="https://images.unsplash.com/photo-1522953978634-50815785beb3?w=900&q=80" alt=""><div class="scrim scrim-photo"></div></div>
    <figcaption><b>1 · Zalazak (izabrana)</b><span>Wes Hicks, Unsplash licenca.</span></figcaption>
  </figure>
  <figure>
    <div class="phone"><img class="bg" src="https://images.unsplash.com/photo-1607627133482-222fc028e4f3?w=900&q=80" alt=""><div class="scrim scrim-photo"></div></div>
    <figcaption><b>2 · Chill uz laptop</b><span>Klara Kulikova, Unsplash licenca. Laptop u tamnoj sobi, prozor u sumrak.</span></figcaption>
  </figure>
  <figure>
    <div class="phone"><img class="bg" src="https://images.unsplash.com/photo-1788094667323-537542a062d6?w=900&q=80" alt=""><div class="scrim scrim-photo"></div></div>
    <figcaption><b>3 · Sport</b><span>Tony Chen, Unsplash licenca. Biciklista u siluetu, plavo-narandžasto nebo.</span></figcaption>
  </figure>
</div>

<h2>Ranije opcije</h2>
<div class="row">
  <figure>
    <div class="phone"><img class="bg shift" src="https://images.unsplash.com/photo-1779136930161-f327b8406fef?w=900&q=80" alt=""><div class="scrim scrim-photo"></div></div>
    <figcaption><b>A · Planinari (prava fotografija)</b><span>Bernd Dittrich, Unsplash licenca. Siluete na grebenu, tamnoplavo nebo. Zumirano da planinari budu ispod dugmeta.</span></figcaption>
  </figure>
  <figure>
    <div class="phone hero"><img class="bg" src="https://images.unsplash.com/vector-1790134611785-2b0e65b55f9b?w=900&fm=jpg" alt=""></div>
    <figcaption><b>B · Laptop i kafa (ilustracija)</b><span>Spacepixel Creative, Unsplash licenca. Laptop i kafa napolju kraj kampera, u zalazak sunca. Slika gore, UI spušten ispod.</span></figcaption>
  </figure>
  <figure>
    <div class="phone hero"><img class="bg" src="https://cdn.pixabay.com/photo/2024/06/29/19/34/ai-generated-8861984_1280.jpg" alt=""></div>
    <figcaption><b>C · Devojka uči (ilustracija)</b><span>Pixabay licenca (bez potpisa). Udobna soba, lampa, knjige, čaj. Slika gore, UI spušten ispod. Napomena: Pixabay je označava kao AI-generisanu.</span></figcaption>
  </figure>
</div>

<h2>Od ranije</h2>
<div class="row">
  <figure>
    <div class="phone current"></div>
    <figcaption><b>0 · Trenutno</b><span>Gradijent, bez slike.</span></figcaption>
  </figure>
  <figure>
    <div class="phone"><svg class="bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080F18"/>
      <stop offset="0.45" stop-color="#0F1926"/>
      <stop offset="0.74" stop-color="#18293D"/>
      <stop offset="0.80" stop-color="#2A2F3A"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.38" cy="0.79" r="0.42" gradientTransform="scale(1 0.45) translate(0 0.97)">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FF6B35" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealHaze" cx="0.75" cy="0.72" r="0.5">
      <stop offset="0" stop-color="#3FBFA3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3FBFA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E7EEF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E7EEF6" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="810" cy="430" r="64" fill="#fff"/>
      <circle cx="838" cy="410" r="58" fill="#000"/>
    </mask>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3249"/>
      <stop offset="0.6" stop-color="#13202F"/>
      <stop offset="1" stop-color="#0B141F"/>
    </linearGradient>
    <radialGradient id="emberLake"><stop offset="0" stop-color="#FF6B35" stop-opacity=".32"/><stop offset="1" stop-color="#FF6B35" stop-opacity="0"/></radialGradient>
    <g id="pine">
      <path d="M0,-90 L22,-40 L12,-40 L30,0 L-30,0 L-12,-40 L-22,-40 Z"/>
      <rect x="-4" y="0" width="8" height="14"/>
    </g>
  </defs>

  <rect width="1080" height="2400" fill="url(#sky)"/>
  <rect width="1080" height="2400" fill="url(#tealHaze)"/>
  <rect width="1080" height="2400" fill="url(#ember)"/>

  <g fill="#E7EEF6">
    <circle cx="96" cy="160" r="2.4" opacity=".7"/>
    <circle cx="214" cy="292" r="1.6" opacity=".5"/>
    <circle cx="332" cy="118" r="2" opacity=".8"/>
    <circle cx="470" cy="236" r="1.4" opacity=".45"/>
    <circle cx="560" cy="96" r="2.2" opacity=".65"/>
    <circle cx="642" cy="318" r="1.5" opacity=".5"/>
    <circle cx="968" cy="182" r="2.4" opacity=".75"/>
    <circle cx="1020" cy="402" r="1.6" opacity=".45"/>
    <circle cx="684" cy="520" r="1.8" opacity=".55"/>
    <circle cx="140" cy="470" r="1.8" opacity=".6"/>

    <circle cx="48" cy="690" r="1.6" opacity=".4"/>
    <circle cx="930" cy="640" r="1.4" opacity=".35"/>
    <circle cx="254" cy="640" r="1.2" opacity=".3"/>
    <circle cx="1010" cy="900" r="1.5" opacity=".25"/>
    <circle cx="70" cy="1040" r="1.4" opacity=".22"/>
    <circle cx="1040" cy="1320" r="1.3" opacity=".18"/>
    <circle cx="36" cy="1480" r="1.3" opacity=".16"/>
    <path d="M260,190 l5,15 l15,5 l-15,5 l-5,15 l-5,-15 l-15,-5 l15,-5 Z" opacity=".85"/>
    <path d="M900,300 l3.5,10 l10,3.5 l-10,3.5 l-3.5,10 l-3.5,-10 l-10,-3.5 l10,-3.5 Z" opacity=".6"/>
    <path d="M520,400 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 Z" opacity=".5"/>
  </g>

  <circle cx="810" cy="430" r="190" fill="url(#moonGlow)"/>
  <rect width="1080" height="900" fill="#E7EEF6" mask="url(#crescent)"/>

  <path d="M0,1830 L90,1770 L170,1800 L280,1700 L380,1785 L470,1745 L560,1800 L680,1690 L790,1780 L880,1740 L1000,1800 L1080,1760 L1080,2400 L0,2400 Z" fill="#1B2C40"/>
  <path d="M280,1700 L330,1742 L300,1736 L280,1752 L262,1730 Z M680,1690 L726,1728 L700,1724 L680,1742 L660,1720 Z" fill="#E7EEF6" opacity=".10"/>
  <path d="M0,1900 Q140,1840 300,1880 T620,1870 T900,1850 T1080,1880 L1080,1962 L0,1962 Z" fill="#132134"/>

  <rect y="1960" width="1080" height="440" fill="url(#lake)"/>
  <rect y="1960" width="1080" height="34" fill="#132134" opacity=".55"/>
  <ellipse cx="410" cy="1974" rx="340" ry="22" fill="url(#emberLake)"/>
  <g stroke="#E7EEF6" stroke-linecap="round">
    <path d="M770,2004 h80" stroke-width="5" opacity=".45"/>
    <path d="M784,2036 h52" stroke-width="4" opacity=".38"/>
    <path d="M760,2070 h30 M806,2070 h40" stroke-width="4" opacity=".3"/>
    <path d="M790,2106 h40" stroke-width="3" opacity=".24"/>
    <path d="M776,2142 h22 M812,2142 h18" stroke-width="3" opacity=".18"/>
    <path d="M796,2178 h26" stroke-width="2.5" opacity=".12"/>
  </g>

  <path d="M0,2196 Q170,2160 360,2176 Q520,2190 650,2236 Q830,2296 1080,2262 L1080,2400 L0,2400 Z" fill="#070D15"/>
  <g fill="#070D15">
    <use href="#pine" transform="translate(70,2200) scale(1.5)"/>
    <use href="#pine" transform="translate(150,2186) scale(1.1)"/>
    <use href="#pine" transform="translate(960,2272) scale(1.7)"/>
    <use href="#pine" transform="translate(1040,2266) scale(1.2)"/>
  </g>

  <g transform="translate(430,2180) scale(2.3)" fill="#070D15">
    <circle cx="4" cy="-67" r="11"/>
    <path d="M-16,0 C-18,-20 -14,-42 -4,-54 C2,-56 8,-52 10,-46 L24,-34 L26,-38 C32,-36 34,-30 32,-24 L38,-2 L42,0 Z"/>
  </g>
</svg>
</div>
    <figcaption><b>1 · Nacrtano: „Horizont”</b><span>Vektor (SVG → VectorDrawable, ~10 KB). Mesec, zvezde, jezero; lik sedi na obali i gleda u nebo umesto u telefon.</span></figcaption>
  </figure>
  <figure>
    <div class="phone"><img class="bg" src="https://images.unsplash.com/photo-1522953978634-50815785beb3?w=900&q=80" alt=""><div class="scrim scrim-photo"></div></div>
    <figcaption><b>2 · Prava fotografija</b><span>Wes Hicks, Unsplash licenca (komercijalno OK, bez obaveze potpisa). Teal nebo + narandžast horizont = Skor boje.</span></figcaption>
  </figure>
</div>

<script>
  const tpl = document.getElementById('ui');
  document.querySelectorAll('.phone').forEach(p => { if (!p.querySelector('.pending')) p.appendChild(tpl.content.cloneNode(true)); });
</script>
</body>
</html>
